# Self-hosted crash + error tracking for UltraThink Studio.
# GlitchTip is a Sentry-API-compatible OSS alternative; it accepts the same
# envelope payload our `report_error` Tauri command emits when
# ULTRATHINK_TELEMETRY_DSN is set.
#
# Usage:
#   cd docker
#   cp glitchtip.env.example .env   # then fill SECRET_KEY + EMAIL_URL
#   docker compose -f glitchtip-compose.yml up -d
#   open http://localhost:8000
#   # Sign up; create an "UltraThink Studio" project; copy the DSN.
#   # Then in your Studio shell:
#   export ULTRATHINK_TELEMETRY_DSN="http://<key>@localhost:8000/<id>"
#
# Resource footprint: ~700MB RAM; runs fine on a $5 VPS.

version: "3.9"

x-environment: &default-environment
  DATABASE_URL: postgres://glitchtip:glitchtip@postgres:5432/glitchtip
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
  PORT: 8000
  EMAIL_URL: ${EMAIL_URL:-consolemail://}
  GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8000}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@localhost}
  CELERY_WORKER_AUTOSCALE: "1,3"
  CELERY_WORKER_MAX_TASKS_PER_CHILD: "10000"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: glitchtip
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: glitchtip
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  web:
    image: glitchtip/glitchtip:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      <<: *default-environment
    volumes:
      - uploads:/code/uploads
    restart: unless-stopped

  worker:
    image: glitchtip/glitchtip:latest
    depends_on:
      - postgres
      - redis
    command: ./bin/run-celery-with-beat.sh
    environment:
      <<: *default-environment
    volumes:
      - uploads:/code/uploads
    restart: unless-stopped

  migrate:
    image: glitchtip/glitchtip:latest
    depends_on:
      postgres:
        condition: service_healthy
    command: ./manage.py migrate
    environment:
      <<: *default-environment
    restart: "no"

volumes:
  pg_data:
  uploads:
